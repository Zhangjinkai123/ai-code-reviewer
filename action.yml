name: 'AI Code Reviewer'
description: '基于大模型的 PR 代码审查：解析 Git Diff、生成结构化问题、按严重程度门禁'
author: 'zjk'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  api-key:
    description: 'OpenAI 兼容服务的 API Key'
    required: true
  base-url:
    description: 'OpenAI 兼容服务的 Base URL'
    required: true
  model:
    description: '模型名称'
    required: true
  base-sha:
    description: '审查基准提交；为空时使用默认分支共同祖先'
    required: false
    default: ''
  repo-dir:
    description: '被审查仓库目录；默认为当前工作目录'
    required: false
    default: '.'
  config-path:
    description: '策略文件路径；不存在时使用内置默认阈值 high'
    required: false
    default: 'review.yaml'
  report-path:
    description: 'JSON 报告输出路径'
    required: false
    default: 'reports/review-report.json'

outputs:
  report-path:
    description: '生成的 JSON 报告路径'
    value: ${{ steps.review.outputs.report_path }}
  exit-code:
    description: '审查退出码：0 通过 / 1 门禁失败 / 2 执行失败'
    value: ${{ steps.review.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    # 依赖从 Action 自身目录安装，不使用目标仓库的 requirements.txt。
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check \
          -r "${{ github.action_path }}/requirements.txt"

    - name: Run AI Review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
        OPENAI_BASE_URL: ${{ inputs.base-url }}
        LLM_MODEL: ${{ inputs.model }}
        GITHUB_BASE_SHA: ${{ inputs.base-sha }}
        REVIEW_REPO_DIR: ${{ inputs.repo-dir }}
        REVIEW_CONFIG_PATH: ${{ inputs.config-path }}
        REVIEW_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        # 工具代码来自 Action 自身检出目录，不是目标仓库。
        #
        # 门禁失败（退出码 1）是正常结果，但 Actions 的 bash 默认 -e，
        # 直接执行会让后续输出语句被跳过。这里先吞掉退出码，
        # 记录 output 后再原样返回，保证失败时报告仍然可定位。
        set +e
        output=$(python "${{ github.action_path }}/main.py" review 2>&1)
        status=$?
        printf '%s\n' "$output"

        echo "report_path=${REVIEW_REPORT_PATH}" >> "$GITHUB_OUTPUT"
        echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

        if [ "${status}" -ne 0 ]; then
          echo "::warning::AI Review 退出码 ${status}（1 = 达到严重程度阈值，2 = 执行失败）"

          # 三点 diff 需要共同祖先；浅克隆时 git 报 unknown revision。
          # 这不是代码错误，而是调用方漏了 fetch-depth: 0。
          if printf '%s' "$output" | grep -qi "unknown revision\|bad revision\|no merge base"; then
            echo "::error::diff 无法定位共同祖先，请确认 actions/checkout 设置了 fetch-depth: 0"
          fi
        fi

        exit "${status}"
