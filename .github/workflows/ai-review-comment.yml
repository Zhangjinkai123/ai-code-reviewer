name: AI Code Review Comment


on:

  workflow_run:

    workflows:
      - AI Code Review

    types:
      - completed


permissions:

  contents: read

  issues: write

  pull-requests: write


jobs:


  comment:


    runs-on: ubuntu-latest


    steps:


      -
        name: Show workflow result

        run: |

          echo "Workflow:"
          echo "${{ github.event.workflow_run.name }}"

          echo "Conclusion:"
          echo "${{ github.event.workflow_run.conclusion }}"

          echo "Run ID:"
          echo "${{ github.event.workflow_run.id }}"


      -
        name: Download Review Result

        uses: actions/download-artifact@v4

        with:

          name: ai-review-result

          path: review-result

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}


      -
        name: Show Review Result

        run: |

          echo "=============================="

          echo "AI Review Result"

          echo "=============================="

          cat review-result/review-report.json


      -
        name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      -
        name: Install dependencies

        run: |

          pip install -r requirements.txt


      -
        name: Create PR Comment

        env:

          GITHUB_TOKEN:
            ${{ secrets.GITHUB_TOKEN }}

          GITHUB_REPOSITORY:
            ${{ github.repository }}

          PR_NUMBER:
            ${{ github.event.workflow_run.pull_requests[0].number }}

        run: |

          python -c "
          import os

          from reviewer.commenter import create_pr_comment


          repo = os.environ['GITHUB_REPOSITORY']

          pr_number = int(
              os.environ['PR_NUMBER']
          )

          token = os.environ['GITHUB_TOKEN']


          response = create_pr_comment(
              review_result_path=(
                  'review-result/review-report.json'
              ),
              repo=repo,
              pr_number=pr_number,
              token=token,
          )


          comment_url = response.get(
              'html_url'
          )


          if comment_url:

              print(
                  f'PR comment created: '
                  f'{comment_url}'
              )

          else:

              print(
                  'PR comment created.'
              )
          "