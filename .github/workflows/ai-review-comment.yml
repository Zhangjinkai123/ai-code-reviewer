name: AI Code Review Comment


on:

  workflow_run:

    workflows:
      - AI Code Review

    types:
      - completed


permissions:

  contents: read

  issues: write

  pull-requests: write


jobs:


  comment:


    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'


    runs-on: ubuntu-latest


    steps:


      -
        name: Show workflow result

        run: |

          echo "Workflow:"
          echo "${{ github.event.workflow_run.name }}"

          echo "Conclusion:"
          echo "${{ github.event.workflow_run.conclusion }}"

          echo "Run ID:"
          echo "${{ github.event.workflow_run.id }}"

          echo "Pull Requests:"
          echo '${{ toJSON(github.event.workflow_run.pull_requests) }}'


      -
        name: Check Pull Request

        env:

          PR_COUNT:
            ${{ github.event.workflow_run.pull_requests && length(github.event.workflow_run.pull_requests) || 0 }}

        run: |

          echo "PR count: ${PR_COUNT}"

          if [ "${PR_COUNT}" -eq 0 ]; then

            echo "No Pull Request associated with this workflow run."

            exit 1

          fi


      -
        name: Download Review Result

        uses: actions/download-artifact@v4

        with:

          name: ai-review-result

          path: review-result

          github-token: ${{ secrets.GITHUB_TOKEN }}

          run-id: ${{ github.event.workflow_run.id }}


      -
        name: Show Review Result

        run: |

          echo "=============================="

          echo "AI Review Result"

          echo "=============================="

          cat review-result/review-report.json


      -
        name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      -
        name: Install dependencies

        run: |

          pip install -r requirements.txt


      -
        name: Create PR Comment

        env:

          GITHUB_TOKEN:
            ${{ secrets.GITHUB_TOKEN }}

          GITHUB_REPOSITORY:
            ${{ github.repository }}

          PR_NUMBER:
            ${{ github.event.workflow_run.pull_requests[0].number }}


        run: |

          python -c "
          import os

          from reviewer.commenter import create_pr_comment


          repo = os.environ['GITHUB_REPOSITORY']


          pr_number_text = os.environ.get(
              'PR_NUMBER'
          )


          if not pr_number_text:

              raise RuntimeError(
                  'PR_NUMBER is empty'
              )


          pr_number = int(
              pr_number_text
          )


          token = os.environ.get(
              'GITHUB_TOKEN'
          )


          if not token:

              raise RuntimeError(
                  'GITHUB_TOKEN is empty'
              )


          response = create_pr_comment(
              review_result_path=(
                  'review-result/review-report.json'
              ),
              repo=repo,
              pr_number=pr_number,
              token=token,
          )


          comment_url = response.get(
              'html_url'
          )


          if comment_url:

              print(
                  f'PR comment created: '
                  f'{comment_url}'
              )

          else:

              print(
                  'PR comment created.'
              )
          "